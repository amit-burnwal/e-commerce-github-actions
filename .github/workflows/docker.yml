# Goal - To build and push the docker images

name: Docker build and push

on:
    push:

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        steps:
          - name: code checkout            # code checkout because want to use Dockerfile to pull docker image and  to build the docker image
            uses: actions/checkout@v7

          - name: Docker setup         # docker setup because need to setup docker in ubuntu
            uses: docker/setup-docker-action@v5

          - name: Docker login    # to push the docker image to docker hub require dockerhub login
            uses: docker/login-action@v3
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

              # As we know this build we are running on ubuntu so no need of using BuildX 
        #  - name: Set up Docker Buildx   # Buildx is build tools used to build similarly we have QEMU build tool used for mac
          #  uses: docker/setup-buildx-action@v4
            
          - name: Build and push    # it will build and push the image to dockerhub
            uses: docker/build-push-action@v7
            with:
              push: true  # when we have to only build than make push: false and for build and push keep push: true
              tags: "${{ vars.DOCKERHUB_USERNAME }}/e-commerce-python:latest"  # this is steps used for tagged docker image
              