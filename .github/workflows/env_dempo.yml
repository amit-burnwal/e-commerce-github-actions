name: show environment variables

on:
  workflow_dispatch:         # used for manual trigger

env:
  name: Amit
jobs:
  env_usability:
       runs-on: ubuntu-latest
       steps:
         - name: show plain text environment
           run: echo "environment variable for plain text is ${{env.name}}" 
  
         - name: show secrets env
           run:  echo "display my secrets as secrets ${{secrets.amit.secrets}}"
