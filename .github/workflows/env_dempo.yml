name: Show environment variables

on:
  workflow_dispatch:         # used for manual trigger
    inputs:
      environment:
        description: Select the target environment
        required: false
        default: 'DEV'
        type: choice
        options:
          - DEV
          - STAG
          - PROD
    
        

env:
  name: Sia Boss    #key: value
jobs:
  env_usability:
       runs-on: ubuntu-latest
       steps:
         - name: show plain text environment
           run: echo "environment variable for plain text is - ${{env.name}}" 
           
         - name: show secrets variable as hidden *
           run: echo "display for secrets text ${{secrets.AMIT_SECRETS}}"

         - name: show my docker username
           run: echo "show my docker username - ${{vars.DOCKERHUB_USERNAME}}"
          
            
  
  
